<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🎳 Connection 볼링 클럽 점수관리 System</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase 코어 및 데이터베이스 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Firebase 인증(Auth) 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; -webkit-text-size-adjust: 100%; }
        .container { max-width: 950px; margin: 0 auto; display: none; padding-bottom: 40px; }
        
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); padding: 15px; box-sizing: border-box; }
        .auth-card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        .auth-card h2 { margin-top: 0; color: var(--primary-color); margin-bottom: 10px; font-size: 22px; }
        .auth-card p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
        
        .google-btn { width: 100%; padding: 12px; font-size: 15px; background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); transition: background-color 0.2s; }
        .google-btn:hover { background-color: #f8f9fa; }

        .header-box { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .club-logo { width: 55px; height: 55px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background: white; padding: 3px; border: 2px solid var(--border-color); }
        h1 { color: var(--primary-color); margin: 0; font-size: 20px; text-align: center; }

        .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); overflow-x: auto; }
        .nav-tab-btn { background: none; border: none; padding: 10px 14px; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; transition: all 0.2s; border-bottom: 3px solid transparent; }
        .nav-tab-btn.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); background: #eff6ff; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 15px; }
        .input-group { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        input, select { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary-color); }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button.secondary { background-color: #64748b; }
        button.success { background-color: #16a34a; }
        button.danger { background-color: #ef4444; }
        button.warning { background-color: #d97706; }
        button.kakao-share { background-color: #fee500; color: #191919; font-weight: 600; }

        .team-count-group { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
        .team-count-btn { background: #f1f5f9; color: #475569; border: 1px solid var(--border-color); padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .team-count-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .btn-container { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 13px; color: #64748b; flex-wrap: wrap; gap: 6px; }
        .player-list { max-height: 200px; overflow-y: auto; margin-top: 6px; }
        .player-list.expanded { max-height: none; overflow-y: visible; }
        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f1f5f9; border-radius: 6px; margin-bottom: 5px; font-size: 13px; }
        .player-info { display: flex; align-items: center; gap: 6px; }
        .player-info input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .edit-score-input { width: 50px; padding: 3px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
        .team-box { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; }
        .team-box.rank-1 { border-color: #2563eb !important; background-color: #eff6ff; }
        .team-box.rank-2 { border-color: #16a34a !important; background-color: #f0fdf4; }
        .team-box.rank-3 { border-color: #d97706 !important; background-color: #fffbeb; }
        .team-box h3 { margin-top: 0; font-size: 15px; border-bottom: 2px solid var(--primary-color); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .team-stats { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .team-member { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border-color); font-size: 13px; align-items: center; }

        .score-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; font-size: 12px; white-space: nowrap; }
        .score-table th, .score-table td { border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 6px 4px; text-align: center; }
        .score-table th { background-color: #f1f5f9; color: #475569; border-top: 1px solid var(--border-color); }
        .score-table th:first-child, .score-table td:first-child { border-left: 1px solid var(--border-color); }
        
        .score-table th:first-child, .score-table td:first-child {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .score-table th:first-child { background-color: #e2e8f0; color: #334155; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .score-table td:first-child { 
            background-color: #ffffff; 
            font-weight: 600; 
            box-shadow: inset -1px 0 0 var(--border-color), 2px 0 5px -2px rgba(0,0,0,0.1); 
        }

        .score-input { width: 45px; padding: 4px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; }
        .hist-edit-input { width: 46px; padding: 3px; text-align: center; border: 1px solid #2563eb; border-radius: 4px; font-size: 12px; background: #eff6ff; font-weight:
