    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; -webkit-text-size-adjust: 100%; }
        .container { max-width: 950px; margin: 0 auto; display: none; padding-bottom: 40px; }
        
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); padding: 15px; box-sizing: border-box; }
        .auth-card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        .auth-card h2 { margin-top: 0; color: var(--primary-color); margin-bottom: 10px; font-size: 22px; }
        .auth-card p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
        
        .google-btn { width: 100%; padding: 12px; font-size: 15px; background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); transition: background-color 0.2s; }
        .google-btn:hover { background-color: #f8f9fa; }

        .header-box { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .club-logo { width: 55px; height: 55px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background: white; padding: 3px; border: 2px solid var(--border-color); }
        h1 { color: var(--primary-color); margin: 0; font-size: 20px; text-align: center; }

        .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); overflow-x: auto; }
        .nav-tab-btn { background: none; border: none; padding: 10px 14px; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; transition: all 0.2s; border-bottom: 3px solid transparent; }
        .nav-tab-btn.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); background: #eff6ff; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 15px; }
        .input-group { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        input, select { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary-color); }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button.secondary { background-color: #64748b; }
        button.success { background-color: #16a34a; }
        button.danger { background-color: #ef4444; }
        button.kakao-share { background-color: #fee500; color: #191919; font-weight: 600; }
